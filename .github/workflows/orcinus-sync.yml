# Orcinus upstream sync radar. Periodically tries to merge stablyai/orca@main
# into main. On a clean merge that passes the fork gates it opens a PR for a
# human to merge (the judgment gate). On a conflict it upserts a tracking issue
# instead of failing silently, so the fork never drifts unnoticed.
#
# Note on checks: branch pushes made with GITHUB_TOKEN do NOT trigger workflows,
# so the sync PR carries no separate CI run — that is why the gates run INLINE
# here, before the PR is opened.
name: Orcinus upstream sync

on:
  workflow_dispatch:
  # Armed after the first manual catch-up merge lands. Uncomment to enable the
  # nightly radar (23:19 UTC ≈ 04:19 KST). Until then this workflow is manual-only.
  # schedule:
  #   - cron: '23 19 * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: orcinus-sync
  cancel-in-progress: false

jobs:
  sync:
    # Why the gate: a fork of this fork must never run the sync against its own main.
    if: github.repository == 'sj900211/orcinus'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          # Why keep credentials: this job pushes the sync branch and opens the PR/issue.
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name 'orcinus-sync[bot]'
          git config user.email 'orcinus-sync@users.noreply.github.com'

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/stablyai/orca.git 2>/dev/null \
            || git remote set-url upstream https://github.com/stablyai/orca.git
          git fetch --no-tags upstream main

      - name: Measure gap
        id: gap
        run: |
          behind=$(git rev-list --count main..upstream/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "Upstream is $behind commit(s) ahead of main."

      - name: Attempt merge
        id: merge
        if: steps.gap.outputs.behind != '0'
        run: |
          # Why plain merge (no rebase, no -X): the fork must keep upstream's
          # true history and resolve conflicts deliberately, not let a strategy
          # flag silently drop one side.
          if git merge --no-edit upstream/main; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U | sort -u > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upsert conflict issue
        if: steps.merge.outputs.clean == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const files = fs
              .readFileSync(`${process.env.RUNNER_TEMP}/conflicts.txt`, 'utf8')
              .trim()
              .split('\n')
              .filter(Boolean)
            const label = 'upstream-sync-conflict'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const title = `Upstream sync conflict (${files.length} files)`
            const body = [
              'Upstream `stablyai/orca@main` no longer merges cleanly into `main`.',
              '',
              `**Conflicting files (${files.length}):**`,
              ...files.map((f) => `- \`${f}\``),
              '',
              'Resolve locally: `git fetch upstream && git merge upstream/main`, fix the conflicts, run the gates, push, and merge with a **merge commit** (never squash — squash re-conflicts the next sync).',
              '',
              `_Radar run: ${runUrl}_`,
            ].join('\n')
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label })
            } catch {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd73a4a' })
            }
            const open = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: label,
            })
            if (open.data.length > 0) {
              const number = open.data[0].number
              await github.rest.issues.update({ ...context.repo, issue_number: number, title, body })
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: number,
                body: `Still conflicting as of ${runUrl} — ${files.length} file(s).`,
              })
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: [label] })
            }

      - name: Install dependencies
        if: steps.merge.outputs.clean == 'true'
        uses: ./.github/actions/install-node-dependencies

      - name: Gate — lint
        if: steps.merge.outputs.clean == 'true'
        run: pnpm exec oxlint --format github

      - name: Gate — typecheck
        if: steps.merge.outputs.clean == 'true'
        run: pnpm run typecheck

      - name: Gate — Orcinus identity
        if: steps.merge.outputs.clean == 'true'
        run: node config/scripts/verify-orcinus-identity.mjs

      - name: Gate — fork contract tests
        if: steps.merge.outputs.clean == 'true'
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          config/scripts/verify-dev-channel-packaging.test.mjs
          config/scripts/verify-orcinus-release-assets.test.mjs
          config/scripts/verify-release-required-assets.test.mjs

      - name: Push sync branch and open PR
        if: steps.merge.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BEHIND: ${{ steps.gap.outputs.behind }}
        run: |
          syncdate=$(date -u +%Y%m%d)
          branch="sync/upstream-$syncdate"
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          {
            echo "Automated merge of \`stablyai/orca@main\` into \`main\` ($BEHIND upstream commits)."
            echo ""
            echo "Inline gates (lint, typecheck, Orcinus identity, fork-contract tests) passed in the sync run. This PR carries no separate CI checks because branch pushes made with \`GITHUB_TOKEN\` do not trigger workflows — that is expected."
            echo ""
            echo "**Merge with a merge commit — never squash.** Squashing collapses the upstream history and re-conflicts the next sync."
          } > "$RUNNER_TEMP/pr-body.md"
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "PR already open for $branch."
          else
            gh pr create --base main --head "$branch" \
              --title "Upstream sync $syncdate ($BEHIND commits)" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          fi
